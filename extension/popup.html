<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
    <title>Docs Capture</title>
  </head>
  <body>
    <header class="head">
      <span class="logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M5 3.5h9.5L19 8v12.5a.5.5 0 0 1-.5.5h-13a.5.5 0 0 1-.5-.5v-17Z"
            stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
          <path d="M8.5 12.5l2.2 2.2 4.3-4.6" stroke="currentColor"
            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </span>
      <strong>Docs Capture</strong>
    </header>

    <section class="status" id="status">
      <span class="dot" id="dot"></span>
      <span id="statusText">Ready to capture</span>
    </section>

    <div class="actions">
      <button id="startBtn" class="btn primary">● Start capture</button>
      <button id="stopBtn" class="btn primary hidden">■ Stop &amp; save</button>
      <button id="shotBtn" class="btn ghost hidden">▣ Screenshot this page</button>
      <button id="cancelBtn" class="btn ghost hidden">Discard</button>
    </div>

    <p class="hint" id="hint">
      Click <b>Start</b>, then walk through your process. Every click becomes a step.
    </p>

    <footer class="foot">
      <a id="openApp" href="#" target="_blank">Open my guides ↗</a>
      <button id="settingsToggle" class="link">Settings</button>
    </footer>

    <section id="settings" class="settings hidden">
      <label for="serverUrl">Web app URL</label>
      <input id="serverUrl" type="text" placeholder="http://localhost:5000" />
      <button id="saveServer" class="btn ghost small">Save</button>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
